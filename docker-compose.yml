services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
      - .env.local
    environment:
      DATABASE_URL: postgresql://securhealth:securhealth@db:5432/securhealth
      JWT_SECRET: local-demo-secret-change-me
      ML_SERVICE_URL: http://ml-service:8000
      AUTH_RISK_BLOCK_THRESHOLD: "0.98"
      AUTH_RISK_MIN_FAILED_COUNT: "4"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-}
      SEED_DEFAULT_USERS: "true"
      DEFAULT_ADMIN_EMAIL: admin@securehealth.local
      DEFAULT_ADMIN_PASSWORD: Admin123!
      DEFAULT_CLINICIAN_EMAIL: clinician@securehealth.local
      DEFAULT_CLINICIAN_PASSWORD: Clinician123!
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: securhealth
      POSTGRES_USER: securhealth
      POSTGRES_PASSWORD: securhealth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securhealth -d securhealth"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    environment:
      MODEL_PATH: /app/model_artifacts/pdf_malware_model.joblib
      FEEDBACK_LOG_PATH: /app/data/feedback.jsonl
      PDF_MALWARE_THRESHOLD: "0.70"
      ENABLE_YARA: "true"
      ENABLE_CLAMAV: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    depends_on:
      clamav:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - ml_feedback:/app/data

  clamav:
    image: clamav/clamav-debian:stable
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav

volumes:
  db_data:
  ml_feedback:
  clamav_db:
