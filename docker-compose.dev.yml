name: securehealthml-dev

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: securhealth
      POSTGRES_USER: securhealth
      POSTGRES_PASSWORD: securhealth
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securhealth -d securhealth"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - dev_db_data:/var/lib/postgresql/data

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    environment:
      MODEL_PATH: /app/model_artifacts/pdf_malware_model.joblib
      FEEDBACK_LOG_PATH: /app/data/feedback.jsonl
      PDF_MALWARE_THRESHOLD: "0.70"
      ENABLE_YARA: "true"
      ENABLE_CLAMAV: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    depends_on:
      clamav:
        condition: service_started
    ports:
      - "8001:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - ./ml-service:/app
      - ./ai_model_training/artifacts:/app/model_artifacts:ro
      - ./ml-service/data:/app/data

  clamav:
    image: clamav/clamav-debian:stable
    restart: unless-stopped
    volumes:
      - dev_clamav_db:/var/lib/clamav

volumes:
  dev_db_data:
  dev_clamav_db:
